version: '3.8'

services:
  backend:
    image: python:3.11-slim
    container_name: vibenote-backend
    working_dir: /app
    shm_size: '2gb'
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - DEBUG=True
      - DISPLAY=:99
      - PULSE_SERVER=unix:/run/pulse/native
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    command: >
      sh -c "apt-get update && 
             apt-get install -y libsndfile1 ffmpeg xvfb pulseaudio chromium && 
             pip install --no-cache-dir -r requirements.txt && 
             python run.py"
    restart: unless-stopped

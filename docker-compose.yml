version: '3.8'

services:
  backend:
    image: python:3.11-slim
    container_name: vibenote-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - DEBUG=True
    command: >
      sh -c "apt-get update && 
             apt-get install -y libsndfile1 ffmpeg && 
             pip install --no-cache-dir -r requirements.txt && 
             python run.py"
    restart: unless-stopped

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VibeNote Capturer</title>
    <style>
        :root {
            --bg-base: #0f1016;
            --bg-card: rgba(26, 28, 41, 0.95);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --secondary: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            background: var(--bg-base);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .logo-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-group {
            margin-top: 18px;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(139, 92, 246, 0.4);
        }

        .btn-stop {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
            display: none;
        }

        .btn-stop:hover {
            background: #dc2626;
        }

        .info-card {
            margin-top: 14px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">VN</div>
            <div class="logo-title">VibeNote</div>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Idle</span>
        </div>
    </div>

    <div class="form-group">
        <label for="serverUrl">VibeNote Server URL</label>
        <input type="input" id="serverUrl" value="http://localhost:5000">
    </div>

    <div class="form-group">
        <label for="industry">Industry Context</label>
        <select id="industry">
            <option value="manufacturing">Manufacturing</option>
            <option value="construction">Construction</option>
            <option value="financial services">Financial Services</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-start" id="startBtn">Capture Tab Audio</button>
        <button class="btn-stop" id="stopBtn">Stop Capturing</button>
    </div>

    <div class="info-card">
        Captures live audio of the active browser tab (e.g. Google Meet, Zoom, Teams web app) and streams it directly to your VibeNote dashboard.
    </div>

    <!-- We load background.js. It detects the window context and acts as popup controller. -->
    <script src="background.js"></script>
</body>
</html>
